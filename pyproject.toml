[project]
name = "xiaohongshu-skills"
version = "0.1.0"
description = "小红书自动化 Skills，基于 CDP 浏览器自动化"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.8",
    "python-socks>=2.8.1",
    "requests>=2.28.0",
    "websockets>=12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.optional-dependencies]
dev = [
    "ruff>=0.9.0",
    "pytest>=8.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100
# scripts/ 与 extension/ 属于上游开源代码，不纳入本仓库 lint 范围：
# 保留上游基线原貌，避免格式化改动淹没「上游」与「本仓库新增」的边界
# scripts/ 中由本仓库新增的命令（如 locate-comment）同理不做格式化
# 因此 lint 范围 = desktop/ + tests/ + 根目录脚本
extend-exclude = ["scripts", "extension"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]
ignore = [
    "E402",   # module-level imports not at top (needed for sys.path manipulation)
    "RUF001", # ambiguous unicode characters (Chinese punctuation is intentional)
    "RUF002", # ambiguous unicode in docstrings (Chinese punctuation is intentional)
    "RUF003", # ambiguous unicode in comments (Chinese punctuation is intentional)
]

[tool.ruff.lint.per-file-ignores]
# 界面层内联大量 QSS / HTML 模板字符串，强制换行会改变渲染结果，故不做行长度约束
"desktop/main.py" = ["E501"]
"desktop/ui/*.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["xiaohongshu_skills"]

[project.scripts]
xhs-insight = "desktop.main:main"

[tool.hatch.build.targets.wheel]
# 仅打包桌面端包；scripts/ 与 extension/ 由 CLI 以文件方式运行，无需打包
packages = ["desktop"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
