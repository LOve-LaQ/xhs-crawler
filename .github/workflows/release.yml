name: Release

# 仅在推送 v* 标签（或手动触发）时发布，避免每次 push 到 main 都产生一个 Release
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve tag
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            VERSION=$(grep -m1 '^version' pyproject.toml | sed 's/.*"\(.*\)".*/\1/')
            TAG="v${VERSION}-$(echo "$GITHUB_SHA" | cut -c1-7)"
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # 原来检查的是「tag 是否已存在」。改成 tag 触发后该 tag 必然已存在，
      # 会导致发布被永久跳过；因此改成检查「Release 是否已存在」，保留不重复发布的原意
      - name: Check if release exists
        id: check_tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package source
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          PREFIX="xhs-crawler-${TAG}"
          # desktop/ 与 extension/ 必须一并打包：包内 pyproject.toml 声明了
          # xhs-insight = desktop.main:main 且 packages = ["desktop"]，
          # 缺失会让下载者执行 uv sync 时因找不到 desktop 包而构建失败；
          # extension/ 是桌面端浏览器桥接的运行前提
          tar czf "${PREFIX}.tar.gz" \
            --transform "s,^,${PREFIX}/," \
            --exclude='__pycache__' --exclude='*.pyc' \
            skills/ scripts/ desktop/ extension/ SKILL.md pyproject.toml uv.lock LICENSE README.md
          zip -r "${PREFIX}.zip" \
            skills/ scripts/ desktop/ extension/ SKILL.md pyproject.toml uv.lock LICENSE README.md \
            -x '*.pyc' '__pycache__/*'

      - name: Create GitHub Release
        if: steps.check_tag.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          PREFIX="xhs-crawler-${TAG}"
          gh release create "$TAG" \
            "${PREFIX}.tar.gz" \
            "${PREFIX}.zip" \
            --title "$TAG" \
            --generate-notes
